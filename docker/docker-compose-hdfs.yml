services:
  # ==========================================
  # CỤM HDFS (HADOOP DISTRIBUTED FILE SYSTEM)
  # ==========================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    ports:
      - "9870:9870" # Giao diện Web HDFS
      - "9000:9000" # Cổng giao tiếp Spark <-> HDFS
    environment:
      - CLUSTER_NAME=movielens-hdfs
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000

  # ==========================================
  # CỤM SPARK VÀ KAFKA (Đã bật USE_HDFS)
  # ==========================================
  spark-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    image: movielens-spark:latest
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    depends_on:
      - namenode
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      PYTHONPATH: /opt/app:/opt/spark/python:/opt/spark/python/lib/py4j-src.zip
      USE_HDFS: "true"
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ../data:/opt/data
      - ../src:/opt/app/src
      - ../tests:/opt/app/tests
      - ../report:/opt/app/report
      - ../serving:/opt/app/serving

  spark-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    image: movielens-spark:latest
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
      - namenode
    environment:
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-3}"
      SPARK_WORKER_MEMORY: "${SPARK_WORKER_MEMORY:-3g}"
      PYTHONPATH: /opt/app:/opt/spark/python:/opt/spark/python/lib/py4j-src.zip
      USE_HDFS: "true"
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-2}
    volumes:
      - ../data:/opt/data
      - ../src:/opt/app/src
      - ../report:/opt/app/report

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_JMX_HOSTNAME: localhost
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep Mode"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Cơ chế tự hủy chặt chẽ: Xóa phân đoạn sau 30 phút hoặc khi vượt quá 200MB
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_RETENTION_MINUTES: 30
      KAFKA_LOG_RETENTION_BYTES: 209715200
      KAFKA_LOG_SEGMENT_BYTES: 20971520
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  stream-ingest:
    image: movielens-spark:latest
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      /opt/app/src/jobs/stream_ingest.py
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
      namenode:
        condition: service_started
    environment:
      PYTHONPATH: /opt/app:/opt/spark/python:/opt/spark/python/lib/py4j-src.zip
      USE_HDFS: "true"
    volumes:
      - ../data:/opt/data
      - ../src:/opt/app/src
    deploy:
      restart_policy:
        condition: on-failure

  train-als-stream:
    image: movielens-spark:latest
    command: >
      bash -c "while true; do
        /opt/spark/bin/spark-submit --master spark://spark-master:7077 --driver-memory 2g --conf spark.jars.ivy=/tmp/.ivy2 --packages io.delta:delta-spark_2.12:3.2.0 /opt/app/src/jobs/train_als_stream.py;
        rm -rf /tmp/blockmgr-* /tmp/spark-*;
        echo 'Waiting 60 seconds before next training cycle...';
        sleep 60;
      done"
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
      namenode:
        condition: service_started
    environment:
      PYTHONPATH: /opt/app:/opt/spark/python:/opt/spark/python/lib/py4j-src.zip
      USE_HDFS: "true"
    volumes:
      - ../data:/opt/data
      - ../src:/opt/app/src
      - ../report:/opt/app/report
    deploy:
      restart_policy:
        condition: any

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: movielens-api
    depends_on:
      - spark-master
    ports:
      - "8000:8000"
    volumes:
      - ../data:/opt/data
      - ../serving:/opt/app/serving
    environment:
      USE_HDFS: "false" # Web API và SQLite vẫn phải chạy bằng ổ cứng Local
