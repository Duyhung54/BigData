version: "3.8"

services:
  # ==========================================
  # CỤM HDFS (1 NameNode + 3 DataNodes)
  # ==========================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870" # Web UI quản lý HDFS
      - "9000:9000" # Cổng RPC giao tiếp Spark <-> HDFS
    environment:
      - CLUSTER_NAME=movielens-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=3
      - HDFS_CONF_dfs_blocksize=134217728 # 128 MB chuẩn Big Data
      - HDFS_CONF_dfs_permissions_enabled=false
    volumes:
      - namenode_data:/hadoop/dfs/name

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    restart: always
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - datanode1_data:/hadoop/dfs/data

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    restart: always
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - datanode2_data:/hadoop/dfs/data

  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode3
    restart: always
    depends_on:
      - namenode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - datanode3_data:/hadoop/dfs/data

  # ==========================================
  # CỤM TÍNH TOÁN PHÂN TÁN SPARK
  # ==========================================
  spark-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    image: movielens-spark:latest
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      PYTHONPATH: /opt/app:/opt/spark/python:/opt/spark/python/lib/py4j-src.zip
      USE_HDFS: "${USE_HDFS:-true}"
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ../data:/opt/data
      - ../src:/opt/app/src
      - ../tests:/opt/app/tests
      - ../report:/opt/app/report
      - ../serving:/opt/app/serving

  spark-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    image: movielens-spark:latest
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-2}"
      SPARK_WORKER_MEMORY: "${SPARK_WORKER_MEMORY:-2g}"
      PYTHONPATH: /opt/app:/opt/spark/python:/opt/spark/python/lib/py4j-src.zip
      USE_HDFS: "${USE_HDFS:-true}"
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-3}
    volumes:
      - ../data:/opt/data
      - ../src:/opt/app/src
      - ../report:/opt/app/report

  # ==========================================
  # HÀNG ĐỢI SỰ KIỆN KAFKA CHUẨN KRAFT (KHÔNG CẦN ZOOKEEPER)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L622nShTUiBenDuA501AA'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_RETENTION_MINUTES: 60
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ==========================================
  # CƠ SỞ DỮ LIỆU SERVING (POSTGRESQL & REDIS)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=movielens_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ==========================================
  # LUỒNG XỬ LÝ STREAM (KAFKA -> SPARK STREAMING -> REDIS + DELTA)
  # ==========================================
  stream-ingest:
    image: movielens-spark:latest
    container_name: stream-ingest
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --conf spark.cores.max=2
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.postgresql:postgresql:42.7.3
      /opt/app/src/jobs/stream_trending.py
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_started
      namenode:
        condition: service_started
      redis:
        condition: service_started
    environment:
      PYTHONPATH: /opt/app:/opt/spark/python:/opt/spark/python/lib/py4j-src.zip
      USE_HDFS: "${USE_HDFS:-true}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ../data:/opt/data
      - ../src:/opt/app/src
    deploy:
      restart_policy:
        condition: on-failure

  # ==========================================
  # TẦNG PHỤC VỤ API (FASTAPI)
  # ==========================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: movielens-api
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URI=postgresql://admin:adminpassword@postgres:5432/movielens_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ../data:/opt/data
      - ../src:/opt/app/src
      - ../serving:/opt/app/serving

volumes:
  namenode_data:
  datanode1_data:
  datanode2_data:
  datanode3_data:
  postgres_data:
