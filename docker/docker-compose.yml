services:
  spark-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    image: movielens-spark:latest
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      PYTHONPATH: /opt/app:/opt/spark/python:/opt/spark/python/lib/py4j-src.zip
    ports:
      - "8080:8080"   # Master UI
      - "7077:7077"   # Master RPC
      - "4040:4040"   # Driver UI khi chạy spark-submit
    volumes:
      - ../data:/opt/data
      - ../src:/opt/app/src
      - ../tests:/opt/app/tests
      - ../report:/opt/app/report
      - ../serving:/opt/app/serving

  spark-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    image: movielens-spark:latest
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-3}"
      SPARK_WORKER_MEMORY: "${SPARK_WORKER_MEMORY:-3g}"
      PYTHONPATH: /opt/app:/opt/spark/python:/opt/spark/python/lib/py4j-src.zip
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-2}
    volumes:
      - ../data:/opt/data
      - ../src:/opt/app/src
      - ../report:/opt/app/report

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: movielens-api
    depends_on:
      - spark-master
    ports:
      - "8000:8000"
    volumes:
      - ../data:/opt/data
      - ../serving:/opt/app/serving

  # ---------------------------------------------------------------------------
  # Cụm HDFS cho tầng lake — CHỈ bật khi gọi kèm "--profile hdfs":
  #   docker compose -f docker/docker-compose.yml --profile hdfs up -d
  # Không có profile thì stack mặc định (Spark + app) giữ nguyên như trước và
  # không tốn thêm RAM. Xem docs/superpowers/plans/2026-10-01-hdfs-lake-storage.md.
  #
  # EPHEMERAL: không dùng named volume. Hai replica DataNode dùng chung một
  # volume sẽ tranh nhau in_use.lock; còn NameNode giữ dữ liệu bền mà DataNode
  # thì không sẽ lệch clusterID và DataNode từ chối đăng ký. "compose down" xoá
  # sạch dữ liệu HDFS — không sao, scripts/run_pipeline_hdfs.sh chạy lại ingest
  # mỗi lần.
  #
  # apache/hadoop:3.4.1 (không phải 3.3.6 trong plan): bản này có sẵn trên máy.
  # Spark 3.5.3 mang Hadoop client 3.3.x — giao thức RPC tương thích trong cùng
  # major version 3.
  # ---------------------------------------------------------------------------
  namenode:
    image: apache/hadoop:3.4.1
    container_name: namenode
    hostname: namenode
    profiles: ["hdfs"]
    command: ["hdfs", "namenode"]
    environment:
      # Ghim heap 512m: mặc định ~1g thừa cho vài nghìn block, mà ngân sách RAM
      # của WSL2 (12 GB) đã bị Spark chiếm ~10 GB.
      HDFS_NAMENODE_OPTS: "-Xmx512m"
      # /opt/starter.sh của image tự "hdfs namenode -format" khi thư mục này
      # chưa tồn tại — tức ở lần khởi động đầu của mỗi container mới.
      ENSURE_NAMENODE_DIR: /data/dfs/name
    ports:
      - "9870:9870"   # NameNode Web UI
    volumes:
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

  datanode:
    image: apache/hadoop:3.4.1
    profiles: ["hdfs"]
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    environment:
      HDFS_DATANODE_OPTS: "-Xmx512m"
    volumes:
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    deploy:
      replicas: 2
